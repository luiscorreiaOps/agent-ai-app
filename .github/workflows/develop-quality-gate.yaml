name: Develop Quality Gate

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: develop-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Project validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          warn-only: false

      - name: Run Grafana-style plugin review validation
        run: npm run validate:review

      - name: Upload validation archive
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: grafana-plugin-archive
          path: "*-local.zip"
          if-no-files-found: error
