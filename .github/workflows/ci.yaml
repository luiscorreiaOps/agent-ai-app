name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Go format
        run: |
          unformatted=$(gofmt -l Magefile.go pkg)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not properly formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Go vet
        run: go vet ./pkg/...

      - name: Go test
        run: go test -v -race -count=1 ./pkg/...

      - name: Go security scan
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./pkg/...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./pkg/...

      - name: Go OSV lockfile scan
        run: |
          set -euo pipefail
          osv_dir="$(mktemp -d)"
          cp go.mod go.sum "$osv_dir/"
          docker run --rm -v "${osv_dir}:/src:ro" ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 scan --format vertical -L /src/go.mod

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend test
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: go build -buildvcs=false ./pkg/...

  docker:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build plugin frontend assets
        run: npm run build

      - name: Build Linux backend binary
        run: |
          go build -buildvcs=false -o dist/gpx_agent_ai_app_linux_amd64 ./pkg
          chmod +x dist/gpx_agent_ai_app_linux_amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-ai-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-ai-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-ai-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
