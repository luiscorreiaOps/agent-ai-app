# Linux development only: host networking reaches the loopback-only CPU model.
services:
  decision-fixture:
    image: python:3.12-slim
    network_mode: host
    command: ["python", "/fixture/decision-routing-fixture.py", "--host", "127.0.0.1"]
    volumes:
      - ./scripts/decision-routing-fixture.py:/fixture/decision-routing-fixture.py:ro,Z
  grafana-decision:
    image: grafana/grafana:12.3.1
    network_mode: host
    volumes:
      - ./dist:/var/lib/grafana/plugins/shortbobcat2735-agentai-app:ro,Z
      - ./provisioning-decider-local:/etc/grafana/provisioning:ro,Z
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: shortbobcat2735-agentai-app
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3002"
    depends_on:
      - decision-fixture
