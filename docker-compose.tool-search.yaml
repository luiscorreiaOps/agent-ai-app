services:
  grafana-tool-search:
    image: grafana/grafana:12.3.1
    container_name: shortbobcat2735-agentai-app-tool-search
    ports:
      - "3001:3000"
    volumes:
      - ./dist:/var/lib/grafana/plugins/shortbobcat2735-agentai-app:Z
      - ./provisioning-tool-search:/etc/grafana/provisioning:Z
    environment:
      - GF_DEFAULT_APP_MODE=development
      - GF_LOG_LEVEL=debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=shortbobcat2735-agentai-app,shortbobcat2735-brainagent-app
      - GF_SECURITY_ADMIN_PASSWORD=admin
